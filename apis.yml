name: Memora Health
description: >-
  Memora Health is a healthcare technology company (now part of Commure) that
  provides an AI-powered platform for digitizing and automating complex care
  programs. Its intelligent care enablement platform combines clinical workflow
  automation, remote patient monitoring, symptom management, medication
  adherence, and patient education to reduce clinician inbox burden and keep
  enrolled patients engaged between visits. Memora serves health systems and
  provider organizations across maternal care, surgical care, gastrointestinal
  care, oncology, chronic care management, population health, and transitions of
  care. The company operates as an enterprise B2B solution and does not publish
  a public developer API, developer portal, or SDKs; integrations are delivered
  through direct enterprise engagements. Backed by General Catalyst, Memora is
  migrating onto the Commure platform at commure.com/engage.
